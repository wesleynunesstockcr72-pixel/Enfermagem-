<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SanarEnf Studio</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React e ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel para rodar JSX direto no browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <!-- Seu código React adaptado para script direto -->
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { 
      Pill, Stethoscope, Calculator, BookOpen, Brain, 
      FileText, Activity, Search, ShieldAlert, Sparkles, 
      AlertTriangle, CheckCircle2, ChevronRight, Info, 
      Sun, Moon, Filter, RefreshCw, Bookmark, Share2,
      Lock, Mail, User, LogOut, Plus, Trash2, Edit3, Tag, Calendar
    } = lucide;

    // --- BASE DE DADOS COMPLETA DE MEDICAMENTOS E DISPOSITIVOS ---
    const DATABASE = [
      {

        diluicaoBoasPraticas: 'Diluir preferencialmente em Soro Glicosado 5% (SG 5% 250ml + Noradrenalina 4mg/4ml x 4 ampolas = 16mg/266ml). Evitar SF 0,9% puro por degradação por oxidação em pH alcalino.',
        cuidadosEnfermagem: [

        ],
        contraindicacoes: 'Hipotensão por hipovolemia não corrigida (exceto emergência temporária). Evitar em anestesia com Halotano/Ciclopropano.',
        efeitosColaterais: 'Necrose tecidual por extravasamento, arritmias cardíacas, isquemia periférica/digital, bradicardia reflexa, ansiedade.',
        alternativas: ['dobutamina', 'adrenalina', 'vasopressina']
      },
      {
        id: 'dobutamina',
        nome: 'Dobutamina',
        nomesComerciais: 'Dobutrex',
        tipo: 'medicamento',
        categoria: 'Vasoativo / Inotrópico',
        isMav: true,
        classe: 'Inotrópico Simpatomimético (Agonista Beta-1)',
        mecanismo: 'Aumenta a contratilidade miocárdica e o débito cardíaco com menor efeito na frequência cardíaca se comparado à isoproterenol.',
        indicacoes: 'Choque cardiogênico, insuficiência cardíaca descompensada, suporte inotrópico pós-cirurgia cardíaca.',
        viasPosologia: 'EV contínua por Bomba de Infusão (BIC). Dose: 2,5 a 20 mcg/kg/min.',
        diluicaoBoasPraticas: 'Compatível com SG5% e SF0,9%. Solução padrão: 250mg/20ml em 230ml de SG5% (concentração de 1000 mcg/ml). Solução rosada indica ligeira oxidação, mas não perde potência dentro de 24h.',
        cuidadosEnfermagem: [
          'Monitorar frequência cardíaca, traçado de ECG contínuo e pressão arterial.',
          'Avaliar sinais de melhora de perfusão: débito urinário > 0,5 ml/kg/h, lactato e tempo de enchimento capilar.',
          'Corrigir hipovolemia antes de iniciar a infusão.'
        ],
        contraindicacoes: 'Estenose subaórtica hipertrófica idiopática, hipersensibilidade prévia.',
        efeitosColaterais: 'Taquicardia, extra-sístoles ventriculares, dor anginosa, flutuações de PA.',
        alternativas: ['noradrenalina', 'milrinona']
      },
      {
        id: 'vancomicina',
        nome: 'Vancomicina',
        nomesComerciais: 'Vancocin',

        viasPosologia: 'EV em infusão lenta. Adultos: 15-20 mg/kg a cada 8-12h (Bomba ou gotejamento lento).',
        diluicaoBoasPraticas: 'Reconstituir 500mg com 10ml de AD. Diluir cada 500mg em pelo menos 100ml de SF0,9% ou SG5%. Tempo mínimo de infusão: 60 minutos por 1000mg (1 hora).',
        cuidadosEnfermagem: [
          'Infusão rápida causa a Síndrome do Homem Vermelho (Red Man Syndrome) por liberação histamínica (rubor, prurido, hipotensão). SE OCORRER: pausar ou desacelerar infusão e aplicar anti-histamínico.',
          'Monitorar vancocinemia (nível sérico residual) antes da 4ª dose.',
          'Avaliar função renal (ureia e creatinina) e ototoxicidade diariamente.'
        ],
        contraindicacoes: 'Hipersensibilidade a glicopeptídeos.',
        efeitosColaterais: 'Nefrotoxicidade, ototoxicidade, flebite, reação anafilactóide, trombocitopenia.',

      },
      {
        id: 'fentanil',
        nome: 'Fentanila (Citrato)',
        nomesComerciais: 'Fentanyl',

        categoria: 'Sedativo / Analgésico Opioide',
        isMav: true,
        classe: 'Analgésico Opioide Sintético (Agonista Mu)',

        indicacoes: 'Analgesia de curta duração em anestesia, analgosedação em UTI (pacientes sob ventilação mecânica).',
        viasPosologia: 'EV em bolus lento ou Infusão Contínua BIC. Analgosedação UTI: 0,7 a 10 mcg/kg/h.',
        diluicaoBoasPraticas: 'Diluir 5 ampolas (50mcg/ml de 10ml = 2500mcg) em 200ml de SF 0,9% ou SG 5% (Concentração final 10 mcg/ml).',

          'Monitorar frequência respiratória, saturação de SpO2 e escala de sedação (RASS).',
          'Ter disponível Naloxona (antídoto) e equipamento de reanimação à beira-leito.',
          'Administração rápida em bolus pode desencadear Tórax Rígido (Rigidez Torácica), impedindo a ventilação.'
        ],

      },
      {
        id: 'sne-dobhoff',
        nome: 'Sonda Nasoentérica (SNE) / Dobbhoff',
        nomesComerciais: 'Sonda Nutrisoft, Entral',

        categoria: 'Sondas e Cateteres',
        isMav: false,
        classe: 'Dispositivo Enteral com Mandril e Peso Guia',

        viasPosologia: 'Calibres comuns: 8 Fr (pediátrico/adulto fino), 10 Fr, 12 Fr. Comprimento 100 a 120 cm.',
        diluicaoBoasPraticas: 'Medição: Nariz -> Lóbulo da Orelha -> Apêndice Xifóide + 20 a 30 cm para progressão pós-pilórica.',
        cuidadosEnfermagem: [
          'NUNCA administrar dieta/medicação antes da confirmação RAIO-X de tórax/abdômen para checar o posicionamento.',
          'Não confiar apenas no teste da aspiração ou ausculta com seringa (ausculta epigástrica é falha).',
          'Lavar a sonda com 20-30ml de água morna filtrada ANTES e DEPOIS de cada medicação ou dieta para evitar obstrução.',
          'Remover o fio-guia (mandril) SOMENTE após confirmação radiológica e NUNCA reintroduzir o mandril com a sonda no paciente.'
        ],
        contraindicacoes: 'Trauma facial grave, suspeita de fratura de base de crânio (usar via orogástrica), atresia esofágica.',
        efeitosColaterais: 'Obstrução do lúmen, lesão por pressão na asa nasal, pneumonia por aspiração (se deslocada).',
        alternativas: ['sng-levin', 'gastrostomia-gtt']
      },
      {
        id: 'cvc-duplo-lumen',
        nome: 'Cateter Venoso Central (CVC) Duplo Lúmen',
        nomesComerciais: 'Arrow, Certofix',
        tipo: 'dispositivo',
        categoria: 'Sondas e Cateteres',
        isMav: false,
        classe: 'Acesso Vascular de Curta/Média Permanência',
        mecanismo: 'Acesso intravenoso inserido em veias de grande calibre (Jugular Interna, Subclávia ou Femoral) até a junção cava-atrial.',
        indicacoes: 'Infusão de drogas vasoativas (MAVs), nutrição parenteral total (NPT), monitorização de Pressão Venosa Central (PVC), ausência de rede periférica.',

        diluicaoBoasPraticas: 'Lúmen Distal: Reservado para monitorização de PVC, drogas puras, sangue/hemoderivados. Lúmen Proximal: Vasoativos, NPT, analgesia contínua.',

          'Troca de curativo estéril com filme transparente a cada 7 dias ou antes se sujo/descolado (usar clorexidina alcoólica 2%).',

        ],
        contraindicacoes: 'Infecção ativa no sítio de inserção, trombose venosa profunda conhecida da veia alvo.',

      }

    function App() {
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('sanarenf_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [activeTab, setActiveTab] = useState('bulario');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedFilter, setSelectedFilter] = useState('todos');
      const [selectedItem, setSelectedItem] = useState(null);

      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('sanarenf_notes');
        return saved ? JSON.parse(saved) : [
          {
            id: '1',
            title: 'Evolução de Enfermagem - Leito 302',
            content: 'Paciente calmo, orientado em tempo e espaço. Corado, hidratado. Sinais vitais estáveis: PA 120/80 mmHg, FC 76 bpm, SpO2 98% em ar ambiente. Mantém SNE para dieta em BIC a 60 ml/h.',
            tag: 'Evolução',
            date: '2026-10-30'
          }
        ];
      });
      
      const [noteTitle, setNoteTitle] = useState('');
      const [noteContent, setNoteContent] = useState('');
      const [noteTag, setNoteTag] = useState('Plantão');
      const [noteSearch, setNoteSearch] = useState('');
      const [editingNoteId, setEditingNoteId] = useState(null);

      useEffect(() => {
        localStorage.setItem('sanarenf_notes', JSON.stringify(notes));
      }, [notes]);

      useEffect(() => {
        if (user) {
          localStorage.setItem('sanarenf_user', JSON.stringify(user));
        } else {
          localStorage.removeItem('sanarenf_user');
        }
      }, [user]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (!loginEmail) return;
        const newUser = {
          name: loginEmail.split('@')[0].toUpperCase(),
          email: loginEmail,
          avatar: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=150&auto=format&fit=crop&q=80'
        };
        setUser(newUser);
      };

      const handleGoogleLogin = () => {
        const newUser = {
          name: 'Enfermeiro(a) Demo',
          email: 'usuario.sanar@enfermagem.com',
          avatar: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=150&auto=format&fit=crop&q=80'
        };
        setUser(newUser);
      };

      const handleLogout = () => {
        setUser(null);
      };

      const handleSaveNote = (e) => {
        e.preventDefault();
        if (!noteTitle.trim() || !noteContent.trim()) return;

        if (editingNoteId) {
          setNotes(notes.map(n => n.id === editingNoteId ? {
            ...n,
            title: noteTitle,
            content: noteContent,
            tag: noteTag
          } : n));
          setEditingNoteId(null);
        } else {
          const newNote = {
            id: Date.now().toString(),
            title: noteTitle,
            content: noteContent,
            tag: noteTag,
            date: new Date().toISOString().split('T')[0]
          };
          setNotes([newNote, ...notes]);
        }

        setNoteTitle('');
        setNoteContent('');
        setNoteTag('Plantão');
      };

      const handleEditNote = (note) => {
        setEditingNoteId(note.id);
        setNoteTitle(note.title);
        setNoteContent(note.content);
        setNoteTag(note.tag);
      };

      const handleDeleteNote = (id) => {
        setNotes(notes.filter(n => n.id !== id));
      };

      const filteredData = useMemo(() => {
        return DATABASE.filter(item => {
          const matchSearch = item.nome.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              item.indicacoes.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              item.categoria.toLowerCase().includes(searchTerm.toLowerCase());
          
          if (selectedFilter === 'todos') return matchSearch;
          if (selectedFilter === 'mav') return matchSearch && item.isMav;
          if (selectedFilter === 'medicamentos') return matchSearch && item.tipo === 'medicamento';
          if (selectedFilter === 'dispositivos') return matchSearch && item.tipo === 'dispositivo';
          return matchSearch;
        });
      }, [searchTerm, selectedFilter]);

      const filteredNotes = useMemo(() => {
        return notes.filter(n => 
          n.title.toLowerCase().includes(noteSearch.toLowerCase()) ||
          n.content.toLowerCase().includes(noteSearch.toLowerCase()) ||
          n.tag.toLowerCase().includes(noteSearch.toLowerCase())
        );
      }, [notes, noteSearch]);

      if (!user) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex items-center justify-center bg-emerald-500 text-slate-950 p-3 rounded-2xl mb-2">
                  <Activity className="w-8 h-8" />
                </div>
                <h1 className="text-2xl font-bold tracking-tight text-white">SanarEnf Studio</h1>
                <p className="text-xs text-slate-400">Portal de Apoio Clínico & Gestão Prática em Enfermagem</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">E-mail ou Registro Pro</label>
                  <div className="relative">
                    <Mail className="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" />
                    <input 
                      type="email" 
                      required
                      placeholder="enfermeiro@sanar.com" 
                      value={loginEmail}
                      onChange={(e) => setLoginEmail(e.target.value)}
                      className="w-full pl-9 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Senha</label>
                  <div className="relative">
                    <Lock className="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" />
                    <input 
                      type="password" 
                      required
                      placeholder="••••••••" 
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      className="w-full pl-9 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200"
                    />
                  </div>
                </div>

                <button 
                  type="submit"
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition text-sm shadow-lg shadow-emerald-500/10"
                >
                  Entrar na Plataforma
                </button>
              </form>

              <div className="relative flex items-center justify-center my-4">
                <div className="border-t border-slate-800 w-full"></div>
                <span className="bg-slate-900 px-3 text-xs text-slate-500 font-medium">OU</span>
              </div>

              <button 
                onClick={handleGoogleLogin}
                className="w-full py-2.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 font-medium rounded-xl transition text-sm flex items-center justify-center gap-2"
              >
                Entrar com Modo Demonstração
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100">
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-emerald-500 text-slate-950 p-2 rounded-xl font-bold flex items-center gap-2">
                  <Activity className="w-5 h-5" />
                  <span className="tracking-tight text-lg">SanarEnf Studio</span>
                </div>
              </div>
              
              <nav className="flex space-x-1">
                <button 
                  onClick={() => setActiveTab('bulario')} 
                  className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${activeTab === 'bulario' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800'}`}
                >
                  <Pill className="w-4 h-4" />
                  Bulário & Dispositivos
                </button>
                <button 
                  onClick={() => setActiveTab('anotacoes')} 
                  className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${activeTab === 'anotacoes' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800'}`}
                >
                  <FileText className="w-4 h-4" />
                  Anotações & Evolução
                </button>
              </nav>

              <div className="flex items-center gap-3">
                <div className="hidden sm:flex items-center gap-2 text-xs">
                  <img src={user.avatar} alt="Avatar" className="w-7 h-7 rounded-full border border-slate-700" />
                  <span className="font-semibold text-slate-300">{user.name}</span>
                </div>
                <button 
                  onClick={handleLogout}
                  title="Sair"
                  className="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition"
                >
                  <LogOut className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8">
            {activeTab === 'bulario' && (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <div className="relative w-full md:w-96">
                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                    <input 
                      type="text" 
                      placeholder="Buscar medicação, sonda ou indicação..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-9 pr-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200"
                    />
                  </div>

                  <div className="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                    {[
                      { id: 'todos', label: 'Todos' },
                      { id: 'mav', label: '🔴 MAVs' },
                      { id: 'medicamentos', label: '💊 Medicamentos' },
                      { id: 'dispositivos', label: '🩺 Sondas & Cateteres' }
                    ].map(f => (
                      <button
                        key={f.id}
                        onClick={() => setSelectedFilter(f.id)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap border transition ${
                          selectedFilter === f.id 
                            ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' 
                            : 'border-slate-800 bg-slate-950 text-slate-400 hover:bg-slate-800'
                        }`}
                      >
                        {f.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredData.map(item => (
                    <div 
                      key={item.id}
                      onClick={() => setSelectedItem(item)}
                      className="bg-slate-900 border border-slate-800 hover:border-emerald-500/50 rounded-2xl p-5 cursor-pointer transition-all hover:scale-[1.01] flex flex-col justify-between group"
                    >
                      <div>
                        <div className="flex justify-between items-start mb-3">
                          <span className="text-xs px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 font-medium border border-slate-700/50">
                            {item.categoria}
                          </span>
                          {item.isMav && (
                            <span className="text-xs px-2 py-0.5 rounded bg-red-500/10 text-red-400 font-bold border border-red-500/20 flex items-center gap-1">
                              <ShieldAlert className="w-3 h-3" /> MAV
                            </span>
                          )}
                        </div>

                        <h3 className="text-lg font-bold text-slate-100 group-hover:text-emerald-400 transition-colors">
                          {item.nome}
                        </h3>
                        <p className="text-xs text-slate-400 mb-4">{item.nomesComerciais}</p>
                        
                        <p className="text-xs text-slate-300 line-clamp-2 mb-4 bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/50">
                          <strong className="text-slate-400">Indicação:</strong> {item.indicacoes}
                        </p>
                      </div>

                      <div className="flex justify-between items-center text-xs text-emerald-400 font-medium pt-3 border-t border-slate-800/60">
                        <span>Ver Ficha Completa</span>
                        <ChevronRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'anotacoes' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 h-fit">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Plus className="w-5 h-5 text-emerald-400" />
                    {editingNoteId ? 'Editar Anotação' : 'Nova Anotação'}
                  </h2>

                  <form onSubmit={handleSaveNote} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Título / Paciente</label>
                      <input 
                        type="text" 
                        placeholder="Ex: Evolução Leito 104"
                        value={noteTitle}
                        onChange={(e) => setNoteTitle(e.target.value)}
                        className="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Tag</label>
                      <select 
                        value={noteTag}
                        onChange={(e) => setNoteTag(e.target.value)}
                        className="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200"
                      >
                        <option value="Plantão">Plantão</option>
                        <option value="Evolução">Evolução</option>
                        <option value="Estudo">Estudo / Concurso</option>
                        <option value="Lembrete">Lembrete Rápido</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Conteúdo</label>
                      <textarea 
                        rows={6}
                        placeholder="Detalhes..."
                        value={noteContent}
                        onChange={(e) => setNoteContent(e.target.value)}
                        className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200 resize-none"
                      />
                    </div>

                    <button 
                      type="submit"
                      className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition text-xs"
                    >
                      {editingNoteId ? 'Atualizar' : 'Salvar Registro'}
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-2 space-y-4">
                  <div className="relative">
                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                    <input 
                      type="text" 
                      placeholder="Pesquisar anotações..."
                      value={noteSearch}
                      onChange={(e) => setNoteSearch(e.target.value)}
                      className="w-full pl-9 pr-4 py-2.5 bg-slate-900 border border-slate-800 rounded-2xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200"
                    />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {filteredNotes.map(n => (
                      <div key={n.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-center mb-2">
                            <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-emerald-400 font-semibold">{n.tag}</span>
                            <span className="text-[10px] text-slate-500">{n.date}</span>
                          </div>
                          <h3 className="font-bold text-slate-100 text-sm mb-1">{n.title}</h3>
                          <p className="text-xs text-slate-300 whitespace-pre-line leading-relaxed">{n.content}</p>
                        </div>
                        <div className="flex justify-end gap-2 pt-3 border-t border-slate-800/60">
                          <button onClick={() => handleEditNote(n)} className="p-1.5 text-slate-400 hover:text-emerald-400"><Edit3 className="w-4 h-4" /></button>
                          <button onClick={() => handleDeleteNote(n.id)} className="p-1.5 text-slate-400 hover:text-red-400"><Trash2 className="w-4 h-4" /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {selectedItem && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex justify-center items-center p-4">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
                  <button onClick={() => setSelectedItem(null)} className="absolute top-5 right-5 text-slate-400 hover:text-white bg-slate-800 p-2 rounded-xl">✕</button>
                  <div className="flex items-center gap-3 mb-2">
                    <span className="text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 font-semibold">{selectedItem.categoria}</span>
                  </div>
                  <h2 className="text-2xl font-bold text-white mb-1">{selectedItem.nome}</h2>
                  <p className="text-sm text-slate-400 mb-6">{selectedItem.nomesComerciais}</p>
                  
                  <div className="space-y-4 text-sm">
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <h4 className="text-emerald-400 font-semibold mb-1">Mecanismo & Classe</h4>
                      <p className="text-slate-300 text-xs">{selectedItem.mecanismo}</p>
                    </div>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <h4 className="text-emerald-400 font-semibold mb-1">Posologia</h4>
                      <p className="text-slate-300 text-xs">{selectedItem.viasPosologia}</p>
                    </div>
                    <div className="bg-emerald-950/20 p-4 rounded-xl border border-emerald-500/30">
                      <h4 className="text-emerald-400 font-bold mb-2">Cuidados de Enfermagem</h4>
                      <ul className="list-disc list-inside space-y-1 text-xs text-slate-200">
                        {selectedItem.cuidadosEnfermagem.map((c, i) => <li key={i}>{c}</li>)}
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
