<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SanarEnf Studio</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React e ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel para rodar JSX direto no browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { 
      Pill, Stethoscope, Calculator, BookOpen, Brain, 
      FileText, Activity, Search, ShieldAlert, Sparkles, 
      AlertTriangle, CheckCircle2, ChevronRight, Info, 
      Sun, Moon, Filter, RefreshCw, Bookmark, Share2,
      Lock, Mail, User, LogOut, Plus, Trash2, Edit3, Tag, Calendar
    } = lucide;

    const DATABASE = [
      {
        id: 'noradrenalina',
        nome: 'Noradrenalina (Hemitartarato)',
        nomesComerciais: 'Levophed, Hyponor',
        tipo: 'medicamento',
        categoria: 'Vasoativo / Inotrópico',
        isMav: true,
        classe: 'Agonista Alfa e Beta-1 Adrenérgico',
        mecanismo: 'Vasoconstrição periférica potente (efeito alfa-1) e modesto inotropismo cardíaco (beta-1), aumentando a resistência vascular sistêmica e a pressão arterial.',
        indicacoes: 'Choque séptico, choque cardiogênico, hipotensão grave refratária à ressuscitação volêmica.',
        viasPosologia: 'Via Endovenosa Exclusiva em Infusão Contínua (Bomba de Infusão). Dose inicial: 0,05 a 0,1 mcg/kg/min, titula a cada 2-5 min segundo PAM (Alvo PAM >= 65 mmHg).',
        diluicaoBoasPraticas: 'Diluir preferencialmente em Soro Glicosado 5% (SG 5% 250ml + Noradrenalina 4mg/4ml x 4 ampolas = 16mg/266ml). Evitar SF 0,9% puro.',
        cuidadosEnfermagem: [
          'Administrar EXCLUSIVAMENTE em Acesso Venoso Central (PICC ou CVC).',
          'Monitorar continuamente Pressão Arterial a cada 5 minutos durante titulação.',
          'Inspecionar sítio de inserção para extravasamento.'
        ],
        contraindicacoes: 'Hipotensão por hipovolemia não corrigida.',
        efeitosColaterais: 'Necrose tecidual por extravasamento, arritmias cardíacas.',
        alternativas: ['dobutamina', 'adrenalina']
      },
      {
        id: 'dobutamina',
        nome: 'Dobutamina',
        nomesComerciais: 'Dobutrex',
        tipo: 'medicamento',
        categoria: 'Vasoativo / Inotrópico',
        isMav: true,
        classe: 'Inotrópico Simpatomimético (Agonista Beta-1)',
        mecanismo: 'Aumenta a contratilidade miocárdica e o débito cardíaco.',
        indicacoes: 'Choque cardiogênico, insuficiência cardíaca descompensada.',
        viasPosologia: 'EV contínua por Bomba de Infusão (BIC). Dose: 2,5 a 20 mcg/kg/min.',
        diluicaoBoasPraticas: 'Compatível com SG5% e SF0,9%.',
        cuidadosEnfermagem: [
          'Monitorar frequência cardíaca e ECG contínuo.',
          'Avaliar débito urinário e sinais de melhora de perfusão.'
        ],
        contraindicacoes: 'Estenose subaórtica hipertrófica idiopática.',
        efeitosColaterais: 'Taquicardia, dor anginosa.',
        alternativas: ['noradrenalina']
      }
    ];

    function App() {
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('sanarenf_user');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [activeTab, setActiveTab] = useState('bulario');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedFilter, setSelectedFilter] = useState('todos');
      const [selectedItem, setSelectedItem] = useState(null);

      const [notes, setNotes] = useState(() => {
        try {
          const saved = localStorage.getItem('sanarenf_notes');
          return saved ? JSON.parse(saved) : [
            {
              id: '1',
              title: 'Evolução de Enfermagem - Leito 302',
              content: 'Paciente estável, mantendo parâmetros vitais dentro da normalidade.',
              tag: 'Evolução',
              date: '2026-10-30'
            }
          ];
        } catch {
          return [];
        }
      });
      
      const [noteTitle, setNoteTitle] = useState('');
      const [noteContent, setNoteContent] = useState('');
      const [noteTag, setNoteTag] = useState('Plantão');
      const [noteSearch, setNoteSearch] = useState('');
      const [editingNoteId, setEditingNoteId] = useState(null);

      useEffect(() => {
        localStorage.setItem('sanarenf_notes', JSON.stringify(notes));
      }, [notes]);

      useEffect(() => {
        if (user) {
          localStorage.setItem('sanarenf_user', JSON.stringify(user));
        } else {
          localStorage.removeItem('sanarenf_user');
        }
      }, [user]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (!loginEmail) return;
        setUser({
          name: loginEmail.split('@')[0].toUpperCase(),
          email: loginEmail,
          avatar: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=150&auto=format&fit=crop&q=80'
        });
      };

      const handleGoogleLogin = () => {
        setUser({
          name: 'Enfermeiro(a) Demo',
          email: 'usuario.sanar@enfermagem.com',
          avatar: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=150&auto=format&fit=crop&q=80'
        });
      };

      const handleLogout = () => {
        setUser(null);
      };

      const handleSaveNote = (e) => {
        e.preventDefault();
        if (!noteTitle.trim() || !noteContent.trim()) return;

        if (editingNoteId) {
          setNotes(notes.map(n => n.id === editingNoteId ? {
            ...n, title: noteTitle, content: noteContent, tag: noteTag
          } : n));
          setEditingNoteId(null);
        } else {
          setNotes([{
            id: Date.now().toString(),
            title: noteTitle,
            content: noteContent,
            tag: noteTag,
            date: new Date().toISOString().split('T')[0]
          }, ...notes]);
        }
        setNoteTitle('');
        setNoteContent('');
      };

      const handleEditNote = (note) => {
        setEditingNoteId(note.id);
        setNoteTitle(note.title);
        setNoteContent(note.content);
        setNoteTag(note.tag);
      };

      const handleDeleteNote = (id) => {
        setNotes(notes.filter(n => n.id !== id));
      };

      const filteredData = useMemo(() => {
        return DATABASE.filter(item => {
          const matchSearch = item.nome.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              item.indicacoes.toLowerCase().includes(searchTerm.toLowerCase());
          if (selectedFilter === 'todos') return matchSearch;
          if (selectedFilter === 'mav') return matchSearch && item.isMav;
          if (selectedFilter === 'medicamentos') return matchSearch && item.tipo === 'medicamento';
          return matchSearch;
        });
      }, [searchTerm, selectedFilter]);

      const filteredNotes = useMemo(() => {
        return notes.filter(n => 
          n.title.toLowerCase().includes(noteSearch.toLowerCase()) ||
          n.content.toLowerCase().includes(noteSearch.toLowerCase())
        );
      }, [notes, noteSearch]);

      if (!user) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex items-center justify-center bg-emerald-500 text-slate-950 p-3 rounded-2xl mb-2">
                  <Activity className="w-8 h-8" />
                </div>
                <h1 className="text-2xl font-bold tracking-tight text-white">SanarEnf Studio</h1>
                <p className="text-xs text-slate-400">Portal de Apoio Clínico & Gestão Prática em Enfermagem</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">E-mail ou Registro Pro</label>
                  <div className="relative">
                    <Mail className="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" />
                    <input 
                      type="email" 
                      required
                      placeholder="enfermeiro@sanar.com" 
                      value={loginEmail}
                      onChange={(e) => setLoginEmail(e.target.value)}
                      className="w-full pl-9 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Senha</label>
                  <div className="relative">
                    <Lock className="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" />
                    <input 
                      type="password" 
                      required
                      placeholder="••••••••" 
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      className="w-full pl-9 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200"
                    />
                  </div>
                </div>

                <button 
                  type="submit"
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition text-sm shadow-lg shadow-emerald-500/10 cursor-pointer"
                >
                  Entrar na Plataforma
                </button>
              </form>

              <button 
                onClick={handleGoogleLogin}
                className="w-full py-2.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 font-medium rounded-xl transition text-sm flex items-center justify-center gap-2 cursor-pointer"
              >
                Entrar com Modo Demonstração
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-emerald-500 text-slate-950 p-2 rounded-xl font-bold flex items-center gap-2">
                  <Activity className="w-5 h-5" />
                  <span className="tracking-tight text-lg">SanarEnf Studio</span>
                </div>
              </div>
              
              <nav className="flex space-x-1">
                <button 
                  onClick={() => setActiveTab('bulario')} 
                  className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 cursor-pointer ${activeTab === 'bulario' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800'}`}
                >
                  <Pill className="w-4 h-4" />
                  Bulário
                </button>
                <button 
                  onClick={() => setActiveTab('anotacoes')} 
                  className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 cursor-pointer ${activeTab === 'anotacoes' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800'}`}
                >
                  <FileText className="w-4 h-4" />
                  Anotações
                </button>
              </nav>

              <div className="flex items-center gap-3">
                <span className="hidden sm:inline text-xs font-semibold text-slate-300">{user.name}</span>
                <button 
                  onClick={handleLogout}
                  title="Sair"
                  className="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition cursor-pointer"
                >
                  <LogOut className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl w-full mx-auto px-4 py-8 flex-1">
            {activeTab === 'bulario' && (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <div className="relative w-full md:w-96">
                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                    <input 
                      type="text" 
                      placeholder="Buscar medicação ou dispositivo..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-9 pr-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-200"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredData.map(item => (
                    <div 
                      key={item.id}
                      onClick={() => setSelectedItem(item)}
                      className="bg-slate-900 border border-slate-800 hover:border-emerald-500/50 rounded-2xl p-5 cursor-pointer transition-all flex flex-col justify-between group"
                    >
                      <div>
                        <div className="flex justify-between items-start mb-3">
                          <span className="text-xs px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 font-medium">{item.categoria}</span>
                          {item.isMav && <span className="text-xs px-2 py-0.5 rounded bg-red-500/10 text-red-400 font-bold">MAV</span>}
                        </div>
                        <h3 className="text-lg font-bold text-slate-100 group-hover:text-emerald-400 transition-colors">{item.nome}</h3>
                        <p className="text-xs text-slate-400 mb-4">{item.nomesComerciais}</p>
                      </div>
                      <div className="flex justify-between items-center text-xs text-emerald-400 font-medium pt-3 border-t border-slate-800/60">
                        <span>Ver Ficha Completa</span>
                        <ChevronRight className="w-4 h-4" />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'anotacoes' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 h-fit">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Plus className="w-5 h-5 text-emerald-400" />
                    {editingNoteId ? 'Editar Anotação' : 'Nova Anotação'}
                  </h2>
                  <form onSubmit={handleSaveNote} className="space-y-4">
                    <input 
                      type="text" 
                      placeholder="Título / Paciente"
                      value={noteTitle}
                      onChange={(e) => setNoteTitle(e.target.value)}
                      className="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                    />
                    <textarea 
                      rows={5}
                      placeholder="Conteúdo..."
                      value={noteContent}
                      onChange={(e) => setNoteContent(e.target.value)}
                      className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-emerald-500 resize-none"
                    />
                    <button type="submit" className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs cursor-pointer">
                      Salvar Registro
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-2 space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {filteredNotes.map(n => (
                      <div key={n.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-center mb-2">
                            <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-emerald-400 font-semibold">{n.tag}</span>
                            <span className="text-[10px] text-slate-500">{n.date}</span>
                          </div>
                          <h3 className="font-bold text-slate-100 text-sm mb-1">{n.title}</h3>
                          <p className="text-xs text-slate-300 leading-relaxed">{n.content}</p>
                        </div>
                        <div className="flex justify-end gap-2 pt-3 border-t border-slate-800/60">
                          <button onClick={() => handleEditNote(n)} className="p-1.5 text-slate-400 hover:text-emerald-400 cursor-pointer"><Edit3 className="w-4 h-4" /></button>
                          <button onClick={() => handleDeleteNote(n.id)} className="p-1.5 text-slate-400 hover:text-red-400 cursor-pointer"><Trash2 className="w-4 h-4" /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {selectedItem && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex justify-center items-center p-4">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 relative shadow-2xl space-y-4">
                  <button onClick={() => setSelectedItem(null)} className="absolute top-5 right-5 text-slate-400 hover:text-white bg-slate-800 p-2 rounded-xl cursor-pointer">✕</button>
                  <h2 className="text-xl font-bold text-white">{selectedItem.nome}</h2>
                  <p className="text-xs text-slate-400">{selectedItem.mecanismo}</p>
                  <div className="bg-emerald-950/20 p-4 rounded-xl border border-emerald-500/30">
                    <h4 className="text-emerald-400 font-bold mb-2 text-xs">Cuidados de Enfermagem</h4>
                    <ul className="list-disc list-inside space-y-1 text-xs text-slate-200">
                      {selectedItem.cuidadosEnfermagem.map((c, i) => <li key={i}>{c}</li>)}
                    </ul>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
